name: correctness
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'ops/reports/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'ops/reports/**'
permissions:
  contents: read
jobs:
  postgres-and-worker:
    # This private development PR uses the tested head push check. Hosted
    # integration jobs remain available to other branches; no fork uses the Pod.
    if: >-
      github.ref != 'refs/heads/codex/gpu-campaign-300b-evidence' &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'codex/gpu-campaign-300b-evidence' &&
        github.event.pull_request.head.repo.full_name == 'yinli-systems/batchforge')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: batchforge
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: batchforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batchforge -d batchforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://batchforge:test-only-ci-password@127.0.0.1:5432/batchforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: PostgreSQL correctness and worker failure tests
        run: python devtools/run_checks.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Console cancellation and retry acknowledgement regressions
        run: node --test frontend/tests/*.test.js
      - name: Compile Python source
        run: python -m compileall -q backend worker agents ops scripts devtools
  existing-pod-cpu:
    # One reviewed private-branch push, on an operator-staged ephemeral runner.
    # No fork PR code or production credentials are passed to the Pod runner.
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/gpu-campaign-300b-evidence' && github.repository == 'yinli-systems/batchforge'
    runs-on: [self-hosted, linux, x64, batchforge-cpu-ephemeral]
    timeout-minutes: 15
    concurrency:
      group: batchforge-existing-pod-cpu
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Locked CPU dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Native PostgreSQL17, worker failures and console regressions
        run: python devtools/run_native_ci.py
