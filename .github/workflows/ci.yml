name: correctness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres-and-worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: batchforge
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: batchforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batchforge -d batchforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://batchforge:test-only-ci-password@127.0.0.1:5432/batchforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: PostgreSQL correctness and worker failure tests
        run: python devtools/run_checks.py
      - name: Compile Python source
        run: python -m compileall -q backend worker ops scripts devtools
